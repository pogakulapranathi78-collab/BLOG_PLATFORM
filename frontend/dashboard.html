<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <div class="container">

        <h1>Blog Dashboard</h1>

        <form id="postForm">

            <input type="text"
                   id="title"
                   placeholder="Post Title"
                   required>

            <textarea id="content"
                      rows="5"
                      placeholder="Write your blog"
                      required></textarea>

            <button type="submit">
                Create Post
            </button>

        </form>

        <hr>

        <div id="posts"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
